name: test
run-name: Running tests
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  pull_request:

jobs:
  # Resolves which Kubernetes versions the tests run against: the fixed set from
  # .github/tested-k8s-versions.json plus whatever k3d currently considers latest
  # (unless that already falls into the fixed set, to avoid a redundant run).
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # Install k3d so we can ask it what its default (latest) k3s version is
      - run: 'curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash'
      - id: resolve
        run: |
          set -euo pipefail

          # The default k3s version baked into the installed k3d, reported as e.g.
          # "k3s version v1.31.5-k3s1 (default)".
          latest="$(k3d version | sed -n 's/^k3s version \(v[^ ]*\).*/\1/p')"
          echo "k3d default k3s version: $latest"

          fixed="$(jq -c '.' .github/tested-k8s-versions.json)"
          echo "fixed versions: $fixed"

          # Append latest only when it is not already part of the fixed set.
          versions="$(jq -c --arg l "$latest" 'if index($l) then . else . + [$l] end' .github/tested-k8s-versions.json)"
          echo "versions to test: $versions"

          # Build a matrix with an "image" per version plus an "is_latest" marker.
          matrix="$(jq -c --arg l "$latest" '{include: map({version: ., image: ("rancher/k3s:" + .), is_latest: (. == $l)})}' <<< "$versions")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test-version:
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # Install kubectl
      - run: 'curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"'
      # Install k3d
      - run: 'curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash'
      # Run tests against the Kubernetes version for this matrix leg
      - run: go test -v ./...
        env:
          K3S_IMAGE: ${{ matrix.image }}

  # The branch ruleset requires a status check named "run-tests"; this job is it,
  # succeeding only when every test-version leg passed.
  run-tests:
    needs: test-version
    runs-on: ubuntu-latest
    steps:
      - run: echo "all Kubernetes versions passed"

  # Fails if the README's tested-versions section is stale, pointing the author
  # at the tool that regenerates it. CI checks rather than commits so it need not
  # push to the protected branch.
  check-readme:
    needs: run-tests
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go run ./tools/testedversions -check
