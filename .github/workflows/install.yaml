# This is Github workflow that installs mcp-k8s from npm to various platforms and tests if it was installed

name: Install mcp-k8s

on:
  schedule:
    # check that the install works periodically
    - cron: '0 0 * * 5'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to install (e.g. 0.6.3). Leave empty for latest.'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to install (e.g. 0.6.3). Leave empty for latest.'
        required: false
        default: ''
        type: string

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        # runs-on reads only matrix.os, so each os is the full runner label for
        # its arch; this runs every platform binary on matching hardware.
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-13
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install mcp-k8s from docker
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -u
          # Docker tags keep the tag's leading v (v0.6.3); npm versions are bare.
          bare="${INPUT_VERSION#v}"
          if [ -n "$bare" ]; then tag="v$bare"; else tag="latest"; fi
          image="mcpk8s/server:$tag"
          echo "Pulling $image (waiting up to 5 minutes for availability)"
          deadline=$(( $(date +%s) + 300 ))
          until docker pull "$image" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 5 minutes waiting for $image"
              exit 1
            fi
            echo "Image not available yet; retrying in 15s..."
            sleep 15
          done
          docker run --rm "$image" version

      - name: Install mcp-k8s from npm
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -u
          target="${INPUT_VERSION#v}"
          if [ -n "$target" ]; then
            spec="@strowk/mcp-k8s@$target"
          else
            spec="@strowk/mcp-k8s@latest"
          fi
          echo "Installing $spec (waiting up to 5 minutes for availability)"

          # The platform binary is an optionalDependency: npm install can succeed
          # while skipping a not-yet-published binary, so verify the binary runs
          # and matches the requested version, not just that install exited 0.
          # `mcp-k8s version` prints via Go's println (stderr), so capture 2>&1.
          attempt() {
            npm install -g "$spec" --prefer-online >/dev/null 2>&1 || return 1
            local out
            out="$(mcp-k8s version 2>&1)" || return 1
            if [ -n "$target" ] && ! printf '%s' "$out" | grep -q "$target"; then
              return 1
            fi
            printf '%s\n' "$out"
          }

          deadline=$(( $(date +%s) + 300 ))
          until out="$(attempt)"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 5 minutes waiting for $spec to be installable"
              exit 1
            fi
            echo "Not ready yet; retrying in 15s..."
            sleep 15
          done

          echo "Installed and verified:"
          echo "$out"
